<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>University Gyaan - Mock Test 2</title>
    
    <style>
        :root {
            --primary: #4a90e2; 
            --bg-color: #e0e5ec;
            --text-color: #4a4a4a;
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
            --inner-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
            --outer-shadow: 9px 9px 16px var(--shadow-dark), -9px -9px 16px var(--shadow-light);
        }

        body { 
            font-family: 'Segoe UI', Arial, sans-serif; margin: 0; 
            background: var(--bg-color); color: var(--text-color);
            height: 100vh; overflow: hidden; display: flex; flex-direction: column; 
        }

        /* --- 3D UTILS --- */
        .neumorphic {
            background: var(--bg-color);
            border-radius: 20px;
            box-shadow: var(--outer-shadow);
            border: 1px solid rgba(255,255,255,0.4);
        }

        /* --- LOGO STYLES --- */
        .app-logo-large {
            width: 80px; height: 80px; object-fit: contain;
            border-radius: 50%;
            margin-bottom: 10px;
            box-shadow: var(--outer-shadow);
            border: 2px solid white;
        }
        
        .header-logo {
            height: 40px; width: 40px; object-fit: contain;
            border-radius: 50%; border: 1px solid white;
        }

        /* --- ENTRY PAGE --- */
        #entry-page {
            position: fixed; inset: 0; background: var(--bg-color); z-index: 1000;
            display: flex; flex-direction: column; align-items: center; 
            padding: 30px 20px; overflow-y: auto;
        }
        .entry-card {
            padding: 30px; width: 100%; max-width: 450px; text-align: center; margin-top: 10px;
            display: flex; flex-direction: column; align-items: center;
        }
        .input-group { margin-bottom: 20px; text-align: left; width: 100%; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 700; margin-left: 5px;}
        .input-group input, .input-group select { 
            width: 100%; padding: 15px; border: none; border-radius: 12px;
            background: var(--bg-color);
            box-shadow: var(--inner-shadow);
            font-size: 1rem; box-sizing: border-box; outline: none; transition: 0.3s;
        }
        .input-group input:focus { box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light); }

        .btn-start { 
            background: #4a90e2; color: white; border: none; padding: 15px; width: 100%;
            font-size: 1.3rem; font-weight: bold; border-radius: 50px; cursor: pointer;
            box-shadow: 6px 6px 10px rgba(74, 144, 226, 0.4), -6px -6px 10px #ffffff;
            transition: transform 0.2s; margin-top: 10px;
            text-decoration: none; display: inline-block;
        }
        .btn-start:active { box-shadow: inset 3px 3px 6px rgba(0,0,0,0.2); transform: scale(0.98); }

        /* --- EXAM PAGE --- */
        #exam-page { display: none; height: 100%; flex-direction: column; }
        
        header { 
            padding: 10px 15px; 
            background: var(--bg-color); z-index: 10;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        header h2 { margin: 0; color: var(--primary); font-size: 1.2rem; text-shadow: 1px 1px 1px white; }

        .main-container { 
            display: flex; flex-direction: column; flex: 1; 
            padding: 15px; gap: 20px; overflow: hidden; 
        }
        
        .question-area { 
            flex: 1; padding: 20px; display: flex; flex-direction: column; 
            overflow-y: auto; position: relative;
        }
        
        .info-bar { 
            display: flex; justify-content: space-between; margin-bottom: 20px; 
            font-weight: bold; padding: 10px 15px; border-radius: 12px;
            box-shadow: var(--inner-shadow);
        }
        .timer { color: #e74c3c; font-size: 1.1rem; }
        
        #q-content { flex-grow: 1; overflow-y: auto; padding-right: 5px; }
        #question-text { 
            font-size: 1.1rem; line-height: 1.5; margin: 0 0 20px 0; color: #333; font-weight: 600;
        }

        /* Options */
        .option-card { 
            padding: 12px 15px; border-radius: 15px; margin-bottom: 12px;
            cursor: pointer; transition: 0.2s; display: flex; align-items: flex-start; gap: 12px;
            background: var(--bg-color);
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            border: 2px solid transparent;
        }
        .option-card:active { box-shadow: var(--inner-shadow); transform: translateY(2px); }
        .option-card.selected { 
            border-color: var(--primary); background: #ebf5ff; 
            box-shadow: var(--inner-shadow);
        }
        
        /* Bilingual Option Styling */
        .opt-char { font-weight: 900; color: var(--primary); font-size: 1.2rem; min-width: 25px; margin-top: 2px; }
        .opt-text-en { font-weight: 600; color: #333; font-size: 1rem; line-height: 1.3; }
        .opt-text-hi { font-size: 0.9rem; color: #666; margin-top: 4px; font-weight: normal; }

        /* Buttons */
        .controls { margin-top: auto; display: flex; gap: 15px; padding-top: 10px; }
        .btn { 
            flex: 1; border: none; padding: 12px; border-radius: 12px; 
            cursor: pointer; font-weight: 700; color: #555; font-size: 0.9rem; 
            background: var(--bg-color);
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
        }
        .btn:active { box-shadow: var(--inner-shadow); color: var(--primary); }
        .btn-submit { color: #e74c3c; flex: 1.5; } 

        /* Palette */
        .palette-area { 
            height: 90px; padding: 10px; flex-shrink: 0; display: flex; flex-direction: column;
        }
        .q-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(35px, 1fr)); 
            gap: 10px; overflow-y: auto; padding: 5px; 
        }
        .q-badge { 
            height: 35px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; font-size: 0.8rem; font-weight: bold; color: #777;
            background: var(--bg-color);
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
            cursor: pointer;
        }
        .q-badge.current { border: 2px solid var(--primary); color: var(--primary); transform: scale(1.1); }
        .q-badge.answered { background: var(--primary); color: white; box-shadow: inset 2px 2px 5px rgba(0,0,0,0.2); }
        .q-badge.flagged { background: #f1c40f; color: black; }

        /* Mobile Fixes */
        @media (max-width: 768px) {
            .main-container { padding: 10px; gap: 15px; }
            .option-card { padding: 12px; }
            .btn { padding: 10px 5px; font-size: 0.8rem; }
            .opt-text-en { font-size: 0.95rem; }
            .opt-text-hi { font-size: 0.85rem; }
        }

        /* --- MODAL --- */
        .modal { 
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); 
            z-index: 2000; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-content { 
            background: var(--bg-color); padding: 30px; border-radius: 20px; text-align: center; width: 100%; max-width: 350px; 
            box-shadow: var(--outer-shadow); display: flex; flex-direction: column; align-items: center;
        }
    </style>
</head>
<body>

    <div id="entry-page">
        <div class="entry-card neumorphic">
            <img src="logo.jpg" alt="Logo" class="app-logo-large">
            
            <h1 style="color:var(--primary); margin: 5px 0 5px 0;">University Gyaan</h1>
            <p style="margin: 0 0 20px 0; color: #777;">Mock Test 2 (100 Questions)</p>
            
            <div class="input-group">
                <label>Name / नाम</label>
                <input type="text" id="student-name" placeholder="अपना नाम लिखें">
            </div>
            <div class="input-group">
                <label>Stream / कक्षा</label>
                <select id="student-class">
                    <option value="BA">B.A.</option>
                    <option value="B.Sc.">B.Sc.</option>
                    <option value="B.Com">B.Com</option>
                    <option value="Home Science">Home Science</option>
                </select>
            </div>
            <div class="input-group">
                <label>Roll No. / रोल नंबर</label>
                <input type="tel" id="student-roll" placeholder="अपना रोल नंबर लिखें">
            </div>
            
            <div style="text-align: left; margin: 15px 0; font-size: 0.9rem; color: #555; width:100%;">
                <p>⚠️ <b>Note:</b> You need at least <b>33 Correct Answers</b> to Pass.</p>
            </div>

            <button class="btn-start" onclick="startExam()">START EXAM</button>
        </div>
    </div>

    <div id="exam-page">
        <header>
            <img src="logo.jpg" alt="Logo" class="header-logo">
            <h2>First Aid & Health (Mock 2)</h2>
        </header>

        <div class="main-container">
            <div class="question-area neumorphic" id="q-area">
                <div class="info-bar">
                    <span style="color:var(--primary)">Q. <span id="q-num">1</span> / 100</span>
                    <span class="timer" id="timer">120:00</span>
                </div>
                
                <div id="q-content">
                    <h3 id="question-text">Loading...</h3>
                    <div id="options-container"></div>
                </div>

                <div class="controls">
                    <button class="btn" onclick="prevQ()">Prev</button>
                    <button class="btn" style="color:#f39c12" onclick="toggleFlag()">Flag</button>
                    <button class="btn" style="color:var(--primary)" onclick="nextQ()">Next</button>
                    <button class="btn btn-submit" onclick="attemptFinish()">Submit</button>
                </div>
            </div>

            <div class="palette-area neumorphic">
                <div class="q-grid" id="q-grid"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <img src="logo.jpg" alt="Logo" class="app-logo-large" style="width:60px; height:60px;">
            
            <h2 id="modal-title" style="margin: 10px 0 0 0;">Exam Submitted!</h2>
            <div id="score-summary" style="margin: 20px 0; font-size: 1.1rem; font-weight: bold;"></div>
            
            <div id="download-section" style="width: 100%;"></div>
            
            <button class="btn" style="margin-top:20px; background:none; box-shadow:none; color:red;" onclick="location.reload()">Close / Restart</button>
        </div>
    </div>

    <script>
        // --- DATA (UPDATED FOR MOCK TEST 2) ---
        const questions = [
            // PART 1
            { q: "What is the first aim of First Aid? / प्राथमिक उपचार (First Aid) का पहला उद्देश्य क्या है?", o: ["First Aid / प्राथमिक उपचार", "Medicine / दवा", "ICU Treatment / ICU उपचार", "Surgery / सर्जरी"], a: 0 },
            { q: "What is the first action when checking a patient's condition? / किसी मरीज की स्थिति की जांच करते समय सबसे पहले क्या कार्रवाई की जाती है?", o: ["Check for breathing / सांस लेने की जाँच करें", "Check for insurance / बीमा के लिए जाँच करें", "Check for external injuries / बाहरी चोटों की जाँच करें", "Talk to victim and shake shoulders / पीड़ित से बात करें और उसके कंधे हिलाएं"], a: 3 },
            { q: "What are the three basic steps in an emergency? / आपात स्थिति में आप कौन-से तीन बुनियादी कदम उठा सकते हैं?", o: ["Check, Call, Care / चेक, कॉल, केयर", "Call, Check, Care / कॉल, चेक, केयर", "Identify, Decide, Call / पहचानें, निर्णय लें, कॉल करें", "Decide, Execute, Call / निर्णय लें, निष्पादित करें, कॉल करें"], a: 0 },
            { q: "ABC in life support means: / जीवन सहायता में ABC का अर्थ है-", o: ["None of the above / उपरोक्त में से कोई नहीं", "Airway, Bridge, Canal", "Airway, Breathing, Circulation", "Action, Circulation, Breathing"], a: 2 },
            { q: "What is the full form of DRAB in medical first aid? / चिकित्सा प्राथमिक उपचार में DRAB का पूर्णरूप क्या है?", o: ["Drag, Response, Airway, Breathing", "Danger, React, Airway, Breathing", "Danger, Response, Airway, Breathing", "Drag, React, Attack, Breathing"], a: 3 },
            { q: "How many times does a healthy person breathe in a minute? / एक स्वस्थ व्यक्ति एक मिनट में कितनी बार श्वास लेता है?", o: ["15-20 times / 15-20 बार", "10-20 times / 10-20 बार", "20-25 times / 20-25 बार", "12-14 times / 12-14 बार"], a: 0 },
            { q: "How many lungs are there in the human body? / मनुष्य के शरीर में फेफड़ों की संख्या कितनी होती है?", o: ["2", "4", "1", "Many / अनेक"], a: 0 },
            { q: "Where does blood purification take place? / रक्त का शुद्धिकरण कहाँ होता है?", o: ["Lungs / फेफड़े", "Heart / हृदय", "In both Heart and Lungs / हृदय तथा फेफड़े दोनों में", "None / उपर्युक्त में से कोई नहीं"], a: 2 },
            { q: "Approximately how many liters of blood are in a healthy human body? / एक स्वस्थ मनुष्य के शरीर में लगभग कितने लीटर रक्त होता है?", o: ["4", "8", "6", "10"], a: 2 },
            { q: "What is the life span of Red Blood Cells (RBC)? / लाल रक्त कण (RBC) का जीवन कितने दिन का होता है?", o: ["50-60", "210-240", "150-190", "90-120"], a: 3 },
            { q: "Which blood group is called Universal Receiver? / कौन-सा रक्त वर्ग सर्वग्राही (Universal Receiver) कहलाता है?", o: ["Group 'A'", "Group 'O'", "Group 'AB'", "Group 'B'"], a: 2 },
            { q: "Which of the following is the Universal Donor blood group? / सर्वदाता (Universal Donor) रक्त वर्ग निम्न में से कौन-सा है?", o: ["O", "B", "N", "A"], a: 0 },
            { q: "The main organ of the Circulatory System is: / परिसंचरण तन्त्र का मुख्यतम अंग है-", o: ["Lungs / फेफड़े", "Veins / शिराएँ", "Arteries / धमनियाँ", "Heart / हृदय"], a: 3 },
            { q: "Which chamber of the heart has thick and strong walls? / हृदय के किस कोष्ठ की दीवार मोटी एवं दृढ़ होती है?", o: ["Left Atrium / बाएं अलिन्द", "Left Ventricle / बाएं निलय", "Right Atrium / दाएं अलिन्द", "Right Ventricle / दाएं निलय"], a: 1 },
            { q: "If you see a broken bone, what should you do first? / अगर आपको दिखता है कि कोई हड्डी टूट गई है तो पहले क्या करेंगे?", o: ["Leave it as is / उसे ऐसे ही छोड़ देंगे", "Straighten bone and tie a splint / हड्डी को सीधा करके स्प्लिंट/तख्ता बाँध देंगे", "Pour hot water / गर्म पानी डालेंगे", "Massage it / मालिश करेंगे"], a: 1 },
            { q: "First Degree Burn is: / फर्स्ट डिग्री बर्न (First Degree Burn) है-", o: ["Destroying all layers of skin / त्वचा की सभी परतों को नष्ट कर देना", "Redness and blisters / लाल और छाला होना", "Involving only the top layer of skin / केवल त्वचा की ऊपरी परत का शामिल होना", "Most severe burn / जलने में सबसे गंभीर है"], a: 2 },
            { q: "Why should the burnt part be covered with a clean/sterile dressing? / पीड़ित व्यक्ति के जले हुए भाग को साफ या रोगाणुहीन ड्रेसिंग से क्यों ढका जाना चाहिए?", o: ["To keep warm / गर्म रखने के लिए", "To cool down / ठंडा करने के लिए", "To prevent infection / संक्रमण को रोकने के लिए", "Both a and b / (a) और (b) दोनों"], a: 2 },
            { q: "What wound is caused by a pointed weapon driven through the skin? / त्वचा के माध्यम से शरीर में चलाए गए नुकीले हथियार से कौन-सा घाव होता है?", o: ["Incised wound / कटे हुए घाव", "Puncture wound / पंचर घाव", "Closed wound / बंद घाव", "Lacerated wound / विदीर्ण घाव"], a: 1 },
            { q: "How should a victim sit during a nosebleed? / नाक से खून बहने (Nosebleed) पर पीड़ित को कैसे बैठाना चाहिए?", o: ["Head tilted back / सिर पीछे झुकाकर", "Head forward pinching nostrils / सिर आगे झुकाकर और नथुनों को पिंच करके", "Lying down / लेटाकर", "Legs elevated / पैर ऊपर करके"], a: 3 },
            { q: "What are the symptoms of Internal Bleeding? / आंतरिक रक्तस्राव (Internal Bleeding) के लक्षण क्या हैं?", o: ["Rapid weak pulse, thirst / तेजी से कमजोर नाड़ी, अत्यधिक प्यास", "Cold, clammy skin / त्वचा जो ठंडी या नमी महसूस करती है", "Swollen soft tissues / शरीर के कोमल अंग सूजे हुए", "All of the above / उपरोक्त सभी"], a: 3 },
            { q: "CPR process is: / CPR प्रक्रिया है-", o: ["Rescue breathing and chest compression / बचाव श्वास और छाती संपीड़न", "Only chest compression / केवल छाती का संपीड़न", "Only rescue breathing / केवल बचाव श्वास", "Only oxygenation / केवल ऑक्सीकरण"], a: 0 },
            { q: "How deep should chest compressions be on an adult during CPR? / वयस्क पर सीपीआर (CPR) करते समय, छाती का संकुचन कितना गहरा होना चाहिए?", o: ["1.5 inches", "2.5 inches", "2 inches", "3 inches"], a: 3 },
            { q: "How deep should chest compressions be on a child during CPR? / एक बच्चे पर सीपीआर करते समय, छाती का संकुचन कितना गहरा होना चाहिए?", o: ["3 inches", "2 inches", "2.5 inches", "1.5 inches"], a: 3 },
            { q: "Artificial Respiration is also known as: / कृत्रिम श्वसन (Artificial Respiration) को किस रूप में भी जाना जाता है?", o: ["Nebulization", "External respiration", "CPR / हृदय-फुफ्फुसीय पुनर्जीवन", "Internal respiration"], a: 2 },
            { q: "Suitable method for artificial respiration when ribs are broken: / पसलियों के टूट जाने पर कृत्रिम श्वसन के लिए उपयुक्त विधि है-", o: ["Laborde method / लाबोर्ड विधि", "Sylvester method / सिल्वेस्टर विधि", "Schafer method / शेफर विधि", "Mouth to mouth / मुँह से श्वास देना"], a: 0 },
            { q: "What is the ratio for Adult CPR? / वयस्क सीपीआर (Adult CPR) करते समय अनुपात क्या है?", o: ["3 slow breaths, 15 compressions", "1 slow breath, 10 compressions", "5 slow breaths, 10 compressions", "2 slow breaths, 15 compressions / 2 धीमी सांस और 15 छाती संपीड़न"], a: 3 },
            { q: "In general, how should a splint be? / सामान्य तौर पर एक स्पिलंट (Splint) कैसा होना चाहिए?", o: ["Loose / ढीला", "Tied with cravat only / केवल क्रेवेट से बंधा हुआ", "Snug, but not cutting circulation / स्नग, लेकिन इतना तंग नहीं कि परिसंचरण को धीमा कर दे", "None / उपरोक्त में से कोई नहीं"], a: 2 },
            { q: "Use of Elastic Bandages: / लोचदार पट्टियों (Elastic Bandages) का उपयोग बताइए-", o: ["Control swelling and support sprains / सूजन को नियंत्रित और मोच या खिंचाव को सहारा देने के लिए", "Control bleeding / रक्तस्राव को नियंत्रित करने के लिए", "For amputated limb / कटे हुए अंग के लिए", "While splinting / स्प्लिंट लगाते समय"], a: 0 },
            { q: "In which situation can you move the victim? / किस स्थिति में आप पीड़ित को स्थानांतरित (Move) कर सकते हैं?", o: ["Need to care for another victim / जब आपको किसी अन्य पीड़ित की देखभाल करनी हो", "Easier to care for victim / पीड़ित की देखभाल करना आसान होगा", "When victim is in danger / जब पीड़ित खतरे में है", "All of the above / उपरोक्त सभी"], a: 2 },

            { q: "Symptoms indicating Internal Bleeding? / निम्नलिखित में से कौन-से लक्षण आंतरिक रक्तस्राव (Internal Bleeding) का संकेत देते हैं?", o: ["Rapid weak pulse, thirst / तेजी से कमजोर नाड़ी, अत्यधिक प्यास", "Cold/clammy skin / त्वचा जो ठंडी या नमी महसूस करती है", "Swollen soft organs / शरीर के कोमल अंग सूजे हुए या सख्त", "All of the above / उपरोक्त सभी"], a: 3 },
            { q: "CPR procedure for a 6-year-old boy? / छह साल के लड़के (6-year-old) के लिए सीपीआर (CPR) प्रक्रिया क्या है?", o: ["5 compressions, 1 breath (5:1)", "15 compressions, 2 breaths", "15 compressions, 1 breath", "3 compressions, 1 breath"], a: 0 },
            { q: "How should breaths be during infant CPR to avoid air in stomach? / शिशु सी०पी०आर० या रेस्क्यू ब्रीदिंग करते समय, पेट में हवा जाने से बचने के लिए सांसें कैसी होनी चाहिए?", o: ["Slowly / धीरे-धीरे से", "Correct and fast / सही और तेज", "Hard and fast / कठिन और तेज", "Long and hard / लंबी और कठिन"], a: 0 },
            { q: "Girl not breathing but has pulse, what to do? / एक लड़की सांस नहीं ले रही है लेकिन उसकी नाड़ी (Pulse) है तब आप क्या करेंगे?", o: ["Call 112, Start CPR", "Wait for help", "Check airway, Start CPR", "Call 112, Start Rescue Breathing / 112 पर कॉल करें, और बचाव श्वास शुरु करें"], a: 3 },
            { q: "Volume of Supplemental Air in cubic cm? / सम्पूरक वायु (Supplemental Air) की मात्रा कितने घन सेण्टीमीटर होती है?", o: ["1500", "500", "1000", "300"], a: 0 },
            { q: "Pharynx is related to how many types of organs? / ग्रसनिका (Pharynx) कितने प्रकार के अंगों से सम्बन्धित होती है?", o: ["3", "4", "5", "2"], a: 2 },
            { q: "Why are Dressing and Pads used? / ड्रेसिंग और पैड (Dressing and Pads) का उपयोग क्यों किया जाता है?", o: ["Absorb blood / खून सोखने के लिये", "Sucking wound on chest / छाती पर चूसने वाले घाव पर", "Not in kit / प्राथमिक चिकित्सा किट में शामिल नहीं हैं", "Control bleeding and keep germs out / रक्तस्त्राव को नियंत्रित करने और कीटाणुओं को बाहर रखने में मदद के लिए"], a: 3 },
            { q: "Bandages are used to: / निम्नलिखित में से पट्टियों (Bandages) का उपयोग किया जाता है-", o: ["Apply directly on wound / रक्त को सोखने के लिए घाव पर सीधे लगाकर", "Only for small wounds / केवल छोटे घाव के लिए", "Reduce pain / दर्द कम करने के लिए", "Hold dressing and control bleeding / ड्रेसिंग को सही जगह रखकर दबाव डालने और रक्तस्त्राव को नियंत्रित करने के लिये"], a: 3 },
            { q: "Care for soft tissue wounds? / कोमल ऊतकों (Soft Tissues) के घावों की देखभाल किस प्रकार की जाती है?", o: ["Heat and elastic bandages", "Ice and bandages", "Both b and c / (b) और (c) दोनों", "Direct pressure / त्वचा के नीचे रक्तस्त्राव को कम करने के लिए हिस्से पर सीधा दबाव डालें"], a: 2 },
            { q: "Order of First Aid: (1)Restore Breath (2)Stop Bleeding (3)Treat Shock (4)Call Doctor / प्राथमिक चिकित्सा का सही क्रम:", o: ["2, 4, 3, 1", "4, 3, 2, 1", "1, 2, 3, 4", "4, 2, 1, 3"], a: 2 },
            { q: "How should a good bandage be? / एक अच्छी पट्टी कैसी होनी चाहिए?", o: ["With germs / कीटाणुओं के साथ", "Wet / गीलेपन के साथ", "Oily / तैलीय", "Germ free / रोगाणु मुक्त"], a: 3 },
            { q: "Protein found in Plasma? / प्लाज्मा में किस प्रकार का प्रोटीन पाया जाता है?", o: ["Albumin", "Globulin", "Fibrinogen", "All of the above / उपर्युक्त सभी"], a: 3 },
            { q: "What are Neutrophils? / न्यूट्रोफिल्स (Neutrophils) क्या है?", o: ["Type of WBC / यह एक प्रकार की श्वेत रक्त कणिकाएँ है", "70% of WBC / इनकी संख्या श्वेत रक्त कणिका में 70% होती है", "Polymorphic center / इनका केन्द्र बहुरूपी होता है", "All of the above / उपर्युक्त सभी"], a: 1 },
            { q: "Granular WBCs are: / कणिकामय श्वेत रक्त कणिकाएँ (Granular WBC) हैं-", o: ["Eosinophils", "Basophils", "Neutrophils", "All of the above / उपर्युक्त सभी"], a: 3 },
            { q: "Blood weight fraction of total body weight? / मनुष्य के शरीर में उसके शरीर के कुल वजन का कितना भाग रक्त (Blood) का होता है?", o: ["1/5", "1/15", "1/10", "1/20"], a: 2 },
            { q: "Platelets are produced by? / प्लेटलेट्स (Platelets) उत्पन्न होती है-", o: ["Fatty food", "Sunlight", "Vitamins", "All of these / इनमें से सभी"], a: 3 },
            { q: "Function of Pericardial fluid? / हृदयावरणी द्रव (Pericardial fluid) का कार्य है-", o: ["Keep heart moist", "Help in movement", "Protect from shock", "All of the above / उपर्युक्त सभी"], a: 3 },
            { q: "Vessels with impure blood and valves? / ऐसी नलिकाएं जिसमें प्रायः अशुद्ध रुधिर बहता है और कपाट (Valves) पाए जाते हैं?", o: ["Vein / शिरा", "Artery / धमनी", "Capillaries / केशिकाएं", "Valve / कपाट"], a: 0 },
            { q: "Structure of Lungs? / फेफड़ों की संरचना (Structure of Lungs) कैसी होती है?", o: ["Spongy / स्पन्जी", "Soft / कोमल", "Solid / ठोस", "Unclear / अस्पष्ट"], a: 0 },
            { q: "Number of Platelets per cubic mm (in Lakhs)? / एक घन मिलीमीटर में बिम्बाणु (Platelets) की संख्या कितने लाख तक होती है?", o: ["2.5-3", "1.5-3", "0.5-3", "3.5-3"], a: 0 },
            { q: "System transporting nutrients and oxygen? / शरीर के उस तन्त्र को क्या कहते हैं जो शरीर के सभी भागों में पोषक तत्वों तथा ऑक्सीजन को पहुँचाने का कार्य करता है?", o: ["Digestive System", "Respiratory System", "Circulatory System / परिसंचरण तन्त्र", "Excretory System"], a: 2 },
            { q: "Center of blood circulation? / रक्त परिभ्रमण का केन्द्र स्थल क्या है?", o: ["Kidney", "Lungs", "Heart / हृदय", "Cell"], a: 2 },
            { q: "Technique used in First Aid? / प्राथमिक चिकित्सा में निम्नलिखित में से कौन-सी तकनीक का उपयोग किया जाता है?", o: ["Bandage / पट्टी", "Transport technique / परिवहन तकनीक", "Bandage / बैंडेज", "All of the above / उपरोक्त सभी"], a: 3 },
            { q: "For a choking infant, what to do? / दम घुटने वाले शिशु के लिए, आप क्या करेंगे?", o: ["Back blows and chest thrusts / पीठ पर वार और छाती पर दबाव", "CPR / सी०पी०आर०", "Heimlich maneuver / हेमलिक प्रक्रिया", "Hold upside down / शिशु को उल्टा पकड़ें और कंधे के ब्लेड के बीच दबाएँ"], a: 0 },
            { q: "Pressure point for forearm wound bleeding? / बांह के अग्र भाग पर लगे घाव पर रक्त प्रवाह कम करने के लिए दबाव कहाँ लागू करेंगे?", o: ["Inside arm between shoulder and elbow / कंधे और कोहनी के बीच हाथ के अंदर", "Inside elbow / कोहनी के अंदर", "Outside arm / हाथ के बाहर", "None / कोई नहीं"], a: 0 },
            { q: "How to reduce infection risk in open wounds? / ऐसे घाव जो खुले हों, उनकी देखभाल करते समय संक्रमण का जोखिम कैसे कम करें?", o: ["Wash hands / हाथ धो लें", "Avoid direct blood contact / रक्त के सीधे संपर्क से बचें", "Use gloves/plastic / दस्ताने या प्लास्टिक की चादर का प्रयोग करें", "All of the above / उपरोक्त सभी"], a: 3 }
        ];

        let userAnswers = new Array(100).fill(null);
        let flagged = new Set();
        let currentIdx = 0;
        let timerSeconds = 120 * 60;
        let timerInterval;
        let tabSwitchCount = 0;
        let isDisqualified = false;

        function startExam() {
            const name = document.getElementById('student-name').value.trim();
            const roll = document.getElementById('student-roll').value.trim();
            if(!name || !roll) return alert("नाम और रोल नंबर भरें!");

            // Randomize questions for the user
            questions.sort(() => Math.random() - 0.5); 

            document.addEventListener("visibilitychange", handleVisibilityChange);
            
            if(document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(e => console.log(e));
            }

            document.getElementById('entry-page').style.display = 'none';
            document.getElementById('exam-page').style.display = 'flex';

            createGrid();
            renderQuestion();
            startTimer();
        }

        function handleVisibilityChange() {
            if (document.hidden) {
                tabSwitchCount++;
                if (tabSwitchCount < 3) {
                    alert(`⚠️ WARNING ${tabSwitchCount}/3: \nटैब या ऐप न बदलें!`);
                } else if (!isDisqualified) {
                    isDisqualified = true;
                    alert(`❌ VIOLATION LIMIT EXCEEDED! \nExam will be FAILED.`);
                    finishExam(true);
                }
            }
        }

        function createGrid() {
            const grid = document.getElementById('q-grid');
            grid.innerHTML = '';
            for(let i=0; i<100; i++) {
                const b = document.createElement('div');
                b.className = 'q-badge';
                b.innerText = i+1;
                b.id = `badge-${i}`;
                b.onclick = () => { currentIdx = i; renderQuestion(); };
                grid.appendChild(b);
            }
        }

        function renderQuestion() {
            const q = questions[currentIdx];
            document.getElementById('q-num').innerText = currentIdx + 1;
            
            const qText = q.q.split(' / ');
            let htmlQ = qText[0];
            if(qText[1]) htmlQ += `<br><small style="color:#555; font-weight:normal;">${qText[1]}</small>`;
            document.getElementById('question-text').innerHTML = htmlQ;
            
            const optCont = document.getElementById('options-container');
            optCont.innerHTML = '';
            
            q.o.forEach((opt, i) => {
                const card = document.createElement('div');
                card.className = `option-card ${userAnswers[currentIdx] === i ? 'selected' : ''}`;
                
                const parts = opt.split(' / ');
                const enText = parts[0];
                const hiText = parts[1] || ""; 
                
                card.innerHTML = `
                    <div class="opt-char">${String.fromCharCode(65+i)}</div>
                    <div>
                        <div class="opt-text-en">${enText}</div>
                        ${hiText ? `<div class="opt-text-hi">${hiText}</div>` : ''}
                    </div>
                `;
                
                card.onclick = () => {
                    if(userAnswers[currentIdx] === null || flagged.has(currentIdx)) {
                        userAnswers[currentIdx] = i;
                        renderQuestion();
                    } else {
                        card.style.transform = "translateY(4px)";
                        setTimeout(()=> card.style.transform = "none", 100);
                    }
                };
                optCont.appendChild(card);
            });

            updateBadges();
        }

        function updateBadges() {
            for(let i=0; i<100; i++){
                const b = document.getElementById(`badge-${i}`);
                if(!b) continue;
                b.className = 'q-badge';
                if(i === currentIdx) b.classList.add('current');
                if(flagged.has(i)) b.classList.add('flagged');
                else if(userAnswers[i] !== null) b.classList.add('answered');
            }
        }

        function toggleFlag() {
            if(flagged.has(currentIdx)) flagged.delete(currentIdx);
            else flagged.add(currentIdx);
            updateBadges();
        }

        function nextQ() { if(currentIdx < 99) { currentIdx++; renderQuestion(); } }
        function prevQ() { if(currentIdx > 0) { currentIdx--; renderQuestion(); } }

        function startTimer() {
            timerInterval = setInterval(() => {
                timerSeconds--;
                let m = Math.floor(timerSeconds/60);
                let s = timerSeconds % 60;
                document.getElementById('timer').innerText = `${m}:${s < 10 ? '0'+s : s}`;
                if(timerSeconds <= 0) { clearInterval(timerInterval); finishExam(); }
            }, 1000);
        }

        function attemptFinish() {
            let attemptCount = userAnswers.filter(a => a !== null).length;
            if(attemptCount < 100) {
                if(!confirm(`⚠️ आपने सिर्फ ${attemptCount} प्रश्न हल किये हैं।\nक्या आप वाकई SUBMIT करना चाहते हैं?`)) return;
            } else {
                if(!confirm("Submit Exam?")) return;
            }
            finishExam(false);
        }

        function finishExam(forced = false) {
            clearInterval(timerInterval);
            document.removeEventListener("visibilitychange", handleVisibilityChange);
            
            let correctCount = 0;
            questions.forEach((q, i) => {
                if(userAnswers[i] === q.a) correctCount++;
            });

            let status = "FAILED";
            let statusColor = "#e74c3c";
            
            if (isDisqualified || forced) {
                status = "FAILED (Cheating)";
            } else if (correctCount >= 33) {
                status = "PASSED";
                statusColor = "#2ecc71";
            }

            document.getElementById('modal').style.display = 'flex';
            document.getElementById('score-summary').innerHTML = `
                Score: <b>${correctCount} / 100</b><br>
                Result: <b style="color:${statusColor}">${status}</b>
            `;

            const downloadSection = document.getElementById('download-section');
            if (correctCount >= 33 && !isDisqualified && !forced) {
                downloadSection.innerHTML = `
                    <p style="color:green; font-weight:bold;">Congratulations! You Passed.</p>
                    <a href="answer_key.pdf" download="Answer_Booklet.pdf" class="btn-start" style="text-decoration:none; padding:12px 20px; font-size:1rem; display:inline-block;">
                        📥 Download Answer Booklet
                    </a>
                `;
            } else {
                let msg = "Score is less than 33. Study hard!";
                if(isDisqualified || forced) msg = "Disqualified due to Cheating.";
                
                downloadSection.innerHTML = `
                    <p style="color:red; font-weight:bold;">${msg}</p>
                    <button class="btn" style="background:#ddd; color:#888; cursor:not-allowed;" disabled>
                        🔒 PDF Locked
                    </button>
                `;
            }
        }
    </script>
</body>
</html>
